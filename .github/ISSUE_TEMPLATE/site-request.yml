name: A new site
description: Ask for a dating site or app the Wingman should know. Its terms are checked first.
labels: ["site request"]
body:
  - type: markdown
    attributes:
      value: |
        This repository ships adapters only for services whose terms do not forbid a helper like the
        Wingman. Before anything is built here, the terms are read and the sentences about bots,
        automation and AI are quoted. If they forbid it, it does not ship here; that is the author's
        choice about what this repository hands out. Many big dating apps forbid it.

        You can still ask your own mission control: "Add <the site's name> to my Wingman." It reads
        the terms, tells you what they say and the risk to your account, and builds it in your own
        folder if you decide to go ahead.
  - type: input
    id: site
    attributes:
      label: Site
      description: The service's name.
      placeholder: Kind Meet
    validations:
      required: true
  - type: input
    id: home
    attributes:
      label: Its address
      description: The website, or the app's Play Store address.
      placeholder: https://kindmeet.example
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Website or app only
      description: Does it have a website where people browse and like, or is it an app and nothing else?
      options:
        - It has a website
        - App only (Android emulator, experimental)
    validations:
      required: true
  - type: textarea
    id: terms
    attributes:
      label: Link to its terms
      description: The terms of service, community guidelines, acceptable use policy, and any developer or API policy. One address per line.
      placeholder: |
        https://kindmeet.example/terms
        https://kindmeet.example/guidelines
    validations:
      required: true
  - type: textarea
    id: quotes
    attributes:
      label: What the terms say about bots, automation and AI
      description: Copy every sentence that speaks to bots, automated access, scripts, scraping, third-party tools or AI, word for word. If nothing speaks to it, write "nothing" and say which words you searched for.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Anything else
      description: Who uses it, and why it would be worth having.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This request holds no real person's name, profile, picture or message.
          required: true
